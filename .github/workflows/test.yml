name: Validate web parser
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and ZIP tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Blog operations unit and acceptance tests
        run: python -m unittest discover -s automation -p "test_*.py" -v
      - name: Windows collector offline unit tests
        run: python -m unittest discover -s tests -p "test_collector.py" -v
      - name: Install browser testing runtime
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Browser interface smoke test
        run: |
          python tests/browser_in_memory.py
          python tests/browser_desktop_bridge.py
          python tests/browser_extension.py
          python tests/browser_fds_2026.py
          python tests/browser_keyword_ops.py
          python tests/browser_local_verify.py
