name: Validate web parser
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and ZIP tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser interface smoke test
        run: python tests/browser_in_memory.py
