name: Build Windows desktop app
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Build Windows EXE (WebView2 required)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SERP-Lens --add-data "web;web" --collect-all webview desktop/launcher.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERP-Lens-Windows
          path: dist/SERP-Lens.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/SERP-Lens.exe --title "SERP Lens ${{ github.ref_name }}" --generate-notes
