name: Mobile blog SERP monitor

on:
  workflow_dispatch:
  schedule:
    # 08:30, 10:30, 13:30 Asia/Seoul. GitHub may start scheduled jobs late.
    - cron: '30 23,1,4 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'web/keyword-ops.*'
      - '.github/workflows/mobile-blog-monitor.yml'

permissions:
  contents: write

concurrency:
  group: mobile-blog-serp
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test evidence, owner, scheduling, and history rules
        run: python -m unittest discover -s automation -p "test_*.py" -v
      - name: Observe mobile integrated search
        run: python -m automation.cli collect
      - name: Validate versioned output
        run: python -m automation.cli validate --input web/ops-data/latest.json
      - name: Retain screenshots only when explicitly enabled
        if: ${{ always() && vars.UPLOAD_SERP_EVIDENCE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: naver-mobile-evidence-${{ github.run_number }}
          path: monitor-evidence/**/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Store observed results without losing concurrent history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp web/ops-data/latest.json /tmp/serp-latest.json
          cp web/ops-data/history.json /tmp/serp-history.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/serp-latest.json web/ops-data/latest.json
            python -m automation.cli merge-history \
              --remote web/ops-data/history.json \
              --observed /tmp/serp-history.json \
              --output web/ops-data/history.json
            python -m automation.cli validate --input web/ops-data/latest.json
            git add web/ops-data/latest.json web/ops-data/history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: update v2 mobile blog observation'
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote changed during observation; retrying (attempt $attempt)"
          done
          exit 1
      - name: Write run summary
        if: always()
        run: |
          echo '## Naver mobile blog observation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Primary metric: observed blog-card order in the mobile integrated feed (not an official Naver rank).' >> "$GITHUB_STEP_SUMMARY"
          echo '- VERIFIED requires ten blog cards, a passing order/duplicate audit and a screenshot hash.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CAPTCHA/access restriction stops subsequent requests.' >> "$GITHUB_STEP_SUMMARY"
