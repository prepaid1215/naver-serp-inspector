name: Mobile blog SERP monitor

on:
  workflow_dispatch:
  schedule:
    # 09:00, 11:00, 14:00 Asia/Seoul (GitHub schedule may be delayed)
    - cron: '0 0,2,5 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/mobile_monitor.py'
      - 'automation/test_mobile_monitor.py'
      - '.github/workflows/mobile-blog-monitor.yml'

permissions:
  contents: write

concurrency:
  group: mobile-blog-serp
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test owner detection and assignment
        run: python -m unittest automation.test_mobile_monitor -v
      - name: Observe mobile integrated search
        run: python -m automation.mobile_monitor
      - name: Retain screenshots for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-mobile-evidence-${{ github.run_number }}
          path: monitor-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Store observed results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/ops-data/latest.json web/ops-data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update mobile blog SERP observation'
          git push origin HEAD:main
