name: Mobile blog SERP monitor

on:
  workflow_dispatch:
  schedule:
    # Before 09:00, 11:00, 14:00 KST publication: collect 30 minutes early (may be delayed)
    - cron: '30 23,1,4 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/mobile_monitor.py'
      - 'automation/test_mobile_monitor.py'
      - '.github/workflows/mobile-blog-monitor.yml'

permissions:
  contents: write

concurrency:
  group: mobile-blog-serp
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test owner detection and assignment
        run: python -m unittest automation.test_mobile_monitor -v
      - name: Observe mobile integrated search
        run: python -m automation.mobile_monitor
      - name: Retain screenshots for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-mobile-evidence-${{ github.run_number }}
          path: monitor-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Store observed results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp web/ops-data/latest.json /tmp/serp-latest.json
          cp web/ops-data/history.json /tmp/serp-history.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/serp-latest.json web/ops-data/latest.json
            cp /tmp/serp-history.json web/ops-data/history.json
            git add web/ops-data/latest.json web/ops-data/history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: update mobile blog SERP observation'
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote changed during observation; retrying (attempt $attempt)"
          done
          exit 1
