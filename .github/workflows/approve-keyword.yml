name: Approve Naver SERP search keyword
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: serp-keyword-approval
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'serp-approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved phrase and add it to a known group
        run: |
          git pull --ff-only origin main
          python -m automation.approve_keyword_issue
      - name: Commit keyword config if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/approved-keywords.json
          if git diff --cached --quiet; then
            echo 'Keyword already approved or already tracked'
            exit 0
          fi
          git commit -m "config: add approved Naver SERP keyword"
          git push origin HEAD:main
